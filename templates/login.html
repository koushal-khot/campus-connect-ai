{% extends "base.html" %}
{% block title %}Log in - Campus Connect AI{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-card">
  <h1>Campus Connect AI</h1>
  <p class="muted">Find teammates, share projects, and study smarter.</p>

  <form method="post" action="{{ url_for('login') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <label>College email
      <input type="email" name="email" autocomplete="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>

  <p class="muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</main>
{% endblock %}
